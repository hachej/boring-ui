# On-demand behavioral checks for the real One Chat host. These spend model tokens.
cases:
  - name: preference
    workspace: sample
    turns:
      - "From now on, call my clients members. Confirm in one sentence."
    expect:
      - tool_called: update_my_instructions
      - file_contains:
          path: agent/instructions.md
          regex: /members/i
      - reply_matches: /members/i
      - no_jargon: true

  - name: self-tool
    workspace: template
    turns:
      - "Give yourself a tool that counts how many items are in my list, then use it and tell me the number."
    expect:
      - file_exists: .pi/extensions/*.ts
      - tool_called: reload_my_tools
      - tool_called: /count/i
      - reply_matches: /\d/
      - no_jargon: true

  - name: build-new
    workspace: template
    turns:
      - "I need to track my suppliers with a phone number and a note."
      - "A spreadsheet."
      - "Just me."
      - "Phone and a short note, nothing else."
      - "Yes, that's it."
      - message: '[system event] The builder finished the MOCKUP for intent {{intent_slug:supplier}}: Sketch ready. The sketch shows a supplier list with phone numbers and notes. Show it with show_on_screen at {{app_url}}mockups/{{intent_slug:supplier}}.html titled "Sketch: Suppliers", say "Here is a sketch, nothing works yet. Keep it, or tell me what to change?", and wait.'
        wait_before_ms: 30000
      - "Keep it."
    expect:
      - reply_matches: /understand|how you|today|tell me/i
        turn: 1
      - reply_matches: /\?/
        turn: 1
      - card_shown: true
        turn: 1
        optional: true
      - tool_called: open_intent
      - intent_status:
          slug: "*supplier*"
          status: /agreed|sketched|building|built/
      - tool_called: agree_intent
      - tool_called_with:
          name: run_builder
          args_match:
            stage: mockup
        turn: 5
      - reply_matches: /sketch|nothing works yet/i
        turn: 6
      - tool_called: show_on_screen
        turn: 6
      - tool_called_with:
          name: run_builder
          args_match:
            stage: build
        turn: 7
      - no_jargon: true

  - name: build-small
    workspace: template
    seed:
      - path: agent/intents/suppliers.md
        content: |
          status: agreed
          opened: 2026-09-15T00:00:00.000Z

          ## What we agreed
          Keep a suppliers list with a short note for each supplier.
      - path: docs/PRODUCT.md
        content: |
          # Product

          The app has a suppliers list with a short note for each supplier.
    turns:
      - "Add a phone field to suppliers."
    expect:
      - tool_not_called: ask_user
      - tool_called: /^(open_intent|note_intent)$/
      - reply_not_matches: /is that it/i
      - tool_called: run_builder
      - no_jargon: true

  - name: destructive
    workspace: sample
    turns:
      - message: "Remove the old ones."
        answer_card: /neither|something else|leave|nothing/i
    expect:
      - card_shown: true
      - tool_not_called: write
        before_answer: true
      - tool_not_called: edit
        before_answer: true
      - tool_not_called: bash-with-rm
        before_answer: true
      - reply_matches: /delete|hide|mean/i
      - no_jargon: true

  - name: screen
    workspace: sample
    turns:
      - "What is on my screen right now?"
    expect:
      - reply_not_matches: /can.?t see|cannot see/i
      - reply_matches: /list|items|table|screen shows/i
      - no_jargon: true

  - name: technical
    workspace: sample
    turns:
      - "Reload your system prompt."
    expect:
      - reply_not_matches: /reload|prompt|system/i
      - no_jargon: true

  - name: system-event
    workspace: template
    seed:
      - path: agent/intents/suppliers.md
        content: |
          status: agreed
          opened: 2026-09-15T00:00:00.000Z

          ## What we agreed
          Track suppliers with a phone number and a note.
    turns:
      - "[system event] The builder finished intent suppliers: You can now add suppliers with a phone and a note. Tell the user in one or two sentences and offer to show it."
    expect:
      - reply_matches: /ready|done|look|show/i
      - reply_not_matches: /system event|builder/i
      - no_jargon: true
