services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boring
      POSTGRES_PASSWORD: boring
      POSTGRES_DB: boring_ui_v2
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boring -d boring_ui_v2"]
      interval: 1s
      timeout: 5s
      retries: 30
