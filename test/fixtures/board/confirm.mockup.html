<!-- A fictional HTML mock-up a PM agent wrote freely: Tailwind classes and the app's theme tokens, no external resources. -->
<main class="mx-auto flex min-h-dvh max-w-sm flex-col gap-4 bg-background p-5 text-foreground">
  <header class="flex items-center justify-between">
    <h1 class="text-lg font-semibold">You're booked</h1>
    <span id="badge" class="rounded-full bg-primary px-3 py-1 text-xs font-medium text-primary-foreground">Confirmed</span>
  </header>
  <section id="summary" class="rounded-xl border border-border bg-card p-4 text-card-foreground shadow-sm">
    <p class="text-sm text-muted-foreground">Harbour Lane Climbing (fictional)</p>
    <p class="mt-1 text-base font-medium">Beginners, Monday 18:00</p>
    <dl class="mt-3 grid grid-cols-2 gap-2 text-sm">
      <dt class="text-muted-foreground">Booking</dt><dd>HL-0042</dd>
      <dt class="text-muted-foreground">Price</dt><dd>12.00</dd>
    </dl>
  </section>
  <section id="reminder" class="flex items-center justify-between rounded-xl bg-muted p-4">
    <div>
      <p class="text-sm font-medium">Reminder the evening before</p>
      <p id="reminder-state" class="text-xs text-muted-foreground">On</p>
    </div>
    <button id="toggle" type="button" class="rounded-md bg-secondary px-3 py-2 text-sm font-medium text-secondary-foreground">Turn off</button>
  </section>
  <button id="calendar" type="button" class="rounded-md bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground">Add to calendar</button>
  <a id="another" href="#" class="text-center text-sm text-primary underline underline-offset-4">Book another session</a>
</main>
<script>
  // The mock-up's own behaviour: it runs only inside the sandboxed frame.
  const toggle = document.getElementById('toggle'), state = document.getElementById('reminder-state');
  toggle.addEventListener('click', () => { const on = state.textContent === 'On'; state.textContent = on ? 'Off' : 'On'; toggle.textContent = on ? 'Turn on' : 'Turn off'; });
</script>
