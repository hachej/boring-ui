# Default gitleaks rules plus reviewed false positives: fictional fixture values and prose, matched by value, not by commit.
[extend]
useDefault = true

[[allowlists]]
description = "Fictional fixtures and prose"
regexTarget = "match"
regexes = [
  '''LANTERN-7F3A9C21''',
  '''sk-fictional-0123456789''',
  '''ghp_fictionalTokenNeverReal0000''',
  '''questions/validation/delivery''',
]

[[allowlists]]
description = "Historical false positive H01: WebSocket handshake nonce in a local server test, base64 for the sample nonce."
condition = "AND"
ruleIDs = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']
paths = [
  '''^packages/workspace/src/server/__tests__/createWorkspaceAgentServer\.listening\.test\.ts$''',
]

[[allowlists]]
description = "Historical false positive H02: Hard-coded invitation UUID in mocked authentication and URL-parsing tests."
condition = "AND"
ruleIDs = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^3fa85f64\-5717\-4562\-b3fc\-2c963f66afa6$''']
paths = [
  '''^packages/core/src/front/__tests__/SignInPage\.test\.tsx$''',
  '''^packages/core/src/front/__tests__/SignUpPage\.test\.tsx$''',
  '''^packages/core/src/front/__tests__/utils\.test\.ts$''',
]

[[allowlists]]
description = "Historical false positive H03: Credential-review prose describing idempotency and concurrency, not a credential."
