version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes updates to the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # npm: security updates are always on (enable "Dependabot security updates" in Settings); version bumps are grouped weekly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @tiptap/markdown still depends on marked ^17 and receives our marked parser instance; move together when Tiptap does.
      - dependency-name: marked
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
