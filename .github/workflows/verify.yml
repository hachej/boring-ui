name: Specification and boundary evidence
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Specification checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      # These are the non-test parts of npm run verify. Registered tests run in release-gate, the rest in tests.
      - run: npm run check
      - run: npm run typecheck
      - name: Install Chromium for the design audit included in verify
        run: npx --yes playwright@1.63.0 install --with-deps chromium-headless-shell
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:design
      - name: Design evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-design-evidence
          path: .cache/evidence/shadcn-first
          retention-days: 7
          if-no-files-found: ignore
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm test -- --exclude-registered
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release gate lists deferrals as backlog but fails on real failures
        shell: bash
        run: |
          pending=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync("VERIFY.json")); console.log(Object.values(r.invariants).flatMap(x=>x.verifiers).filter(x=>x.kind==="pending").length)')
          node scripts/verify-invariants.mjs --release > "$RUNNER_TEMP/release-gate.log" 2>&1 || { cat "$RUNNER_TEMP/release-gate.log"; exit 1; }
          if test "$pending" -gt 0; then
            grep -q "^Runtime verification INCOMPLETE: $pending deferred proofs" "$RUNNER_TEMP/release-gate.log"
            echo "::warning::$pending runtime proofs deferred (backlog per owner ruling 2026-10-10); structural evidence is not runtime qualification"
          fi
      - name: Isolated shared VFS/Bash/Git feasibility (not runtime conformance)
        run: |
          npm install --prefix "$RUNNER_TEMP/vfs-git" --ignore-scripts --no-audit --no-fund --save-exact just-bash@3.6.0 isomorphic-git@1.42.6
          node scripts/probe-vfs-git.mjs "$RUNNER_TEMP/vfs-git"
  isolated-consumers:
    # Each kind packs the packages and installs into temporary apps with the same physical dependency and declaration guards.
    # The slower registry/projection/definitions/testing consumers stay manual, as before.
    name: Isolated package consumers (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: documents
            consumers: document editor html
          - kind: native
            consumers: virtual remote-shell remote-files question presentation
          - kind: canvas
            consumers: canvas canvas-editor canvas-remote
          - kind: composition
            consumers: experience task-list-registry morning pi-chat shared-chat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit actual npm tarballs
        if: matrix.kind == 'documents'
        run: npm run check:pack
      - name: Consumers
        env:
          CONSUMERS: ${{ matrix.consumers }}
        run: |
          for name in $CONSUMERS; do
            echo "::group::test:$name-consumer"
            npm run "test:$name-consumer"
            echo "::endgroup::"
          done
      - name: Install Chromium for the installed PDF viewer check
        if: matrix.kind == 'documents'
        run: npx --yes playwright@1.63.0 install --with-deps chromium-headless-shell
      - name: Allow the Chromium sandbox
        if: matrix.kind == 'documents'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install workspace and portable tree registry recipes
        if: matrix.kind == 'documents'
        run: |
          npm run registry:build
          npm run test:app-registry-consumer
  demo-worker:
    # The public workspace demo's Worker (demos/workspace/cloudflare): build the page and bundle the Worker with a wrangler dry run.
    # No Cloudflare account or secret is used; nothing is deployed.
    name: Public demo Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run workspace-demo:cloudflare:build
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/demo-worker" --config demos/workspace/cloudflare/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
  ci-ok:
    name: verify
    if: always()
    needs: [verify, tests, release-gate, isolated-consumers, demo-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success || exit 1
          done
