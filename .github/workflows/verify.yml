name: Specification and boundary evidence
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
# A new push to a pull request cancels its superseded run; main pushes and release calls keep their own run id and never cancel.
# The literal prefix keeps the release's called workflows in distinct groups.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    name: Specification checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: Require migration notes for published package changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-release-notes.mjs
      # These are the non-test parts of npm run verify. Registered tests run in release-gate, the rest in tests.
      - run: npm run check
      - run: npm run typecheck
      - name: Install Chromium for the design audit included in verify
        timeout-minutes: 8
        # Ubuntu runners already have Chrome libraries; apt is only a fallback for missing ldd dependencies.
        run: bash scripts/install-ci-chromium.sh 1.63.0
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:design
      - name: Transcript scroll budget (500 messages, no long task over 50 ms)
        run: npm run test:chat-scroll
      - name: Sending shows the message at once and scrolls to it (slow host, phone and desktop)
        run: npm run test:chat-send
      - name: Design evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-design-evidence
          path: .cache/evidence/shadcn-first
          retention-days: 7
          if-no-files-found: ignore
  tests:
    runs-on: ubuntu-latest
    # 30, not 20 (D-1937): the suite takes 15-19 min on main and a slow runner crossed 20 (run 42577021357, 20m25s) and cancelled a green release. Splitting the suite is the follow-up.
    timeout-minutes: 30
    # The browser contract tests (compact-primitives, touch-target-dense) read CHROMIUM; with CI set they fail instead of skipping when it is missing.
    env:
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      CHAT_TEXT_EVIDENCE: ${{ github.workspace }}/.cache/evidence/chat-text
      SIDEBAR_ACTION_EVIDENCE: ${{ github.workspace }}/.cache/evidence/sidebar-action
      SHOTS_0473_EVIDENCE: ${{ github.workspace }}/.cache/evidence/shots-0473
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser contract tests
        timeout-minutes: 8
        # Ubuntu runners already have Chrome libraries; apt is only a fallback for missing ldd dependencies.
        run: bash scripts/install-ci-chromium.sh 1.63.0
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test -- --exclude-registered
        env:
          SIDEBAR_RESIZE_EVIDENCE: ${{ runner.temp }}/evidence/sidebar-resize
          SIDEBAR_OPEN_EVIDENCE: ${{ runner.temp }}/evidence/sidebar-open
      - name: Resizable left pane shots (1280, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidebar-resize-shots
          path: ${{ runner.temp }}/evidence/sidebar-resize
          retention-days: 7
          if-no-files-found: warn
      - name: Left pane open on a first visit shots (1280, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidebar-open-shots
          path: ${{ runner.temp }}/evidence/sidebar-open
          retention-days: 7
          if-no-files-found: warn
      - name: AppShell locale shots (390 and 1280, en and fr)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-shell-locale-shots
          path: .cache/evidence/app-shell-locale
          retention-days: 7
          if-no-files-found: ignore
      - name: Screen sidebar sheet shots (390, light and dark, closed and open)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-sidebar-shots
          path: .cache/evidence/screen-sidebar
          retention-days: 14
          if-no-files-found: ignore
      - name: Composer under the content shots (1280 dock closed and open, 390 peek, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-content-shots
          path: .cache/evidence/composer-content
          retention-days: 14
          if-no-files-found: ignore
      - name: Agent bar shots (390 touch, 1280 fine, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-bar-shots
          path: .cache/evidence/agent-bar
          retention-days: 14
          if-no-files-found: ignore
      - name: Nav sheet layer shots (390, touch)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nav-sheet-layer-shots
          path: .cache/evidence/nav-sheet-layer
          retention-days: 14
          if-no-files-found: ignore
      - name: Chat text shots (390 and 1280, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-text-shots
          path: .cache/evidence/chat-text
          retention-days: 14
          if-no-files-found: ignore
      - name: Sidebar action shots (390 touch and 1280, light and dark)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidebar-action-shots
          path: .cache/evidence/sidebar-action
          retention-days: 14
          if-no-files-found: ignore
      - name: Kit 0.4.73 sign-off shots (WorkspaceBar panel, resize handle, phone menu)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-0473-signoff
          path: .cache/evidence/shots-0473
          retention-days: 7
          if-no-files-found: warn
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release gate lists deferrals as backlog but fails on real failures
        shell: bash
        run: |
          pending=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync("VERIFY.json")); console.log(Object.values(r.invariants).flatMap(x=>x.verifiers).filter(x=>x.kind==="pending").length)')
          node scripts/verify-invariants.mjs --release > "$RUNNER_TEMP/release-gate.log" 2>&1 || { cat "$RUNNER_TEMP/release-gate.log"; exit 1; }
          if test "$pending" -gt 0; then
            grep -q "^Runtime verification INCOMPLETE: $pending deferred proofs" "$RUNNER_TEMP/release-gate.log"
            echo "::warning::$pending runtime proofs deferred (backlog per owner ruling 2026-10-10); structural evidence is not runtime qualification"
          fi
      - name: Isolated shared VFS/Bash/Git feasibility (not runtime conformance)
        run: |
          npm install --prefix "$RUNNER_TEMP/vfs-git" --ignore-scripts --no-audit --no-fund --save-exact just-bash@3.6.0 isomorphic-git@1.42.6
          node scripts/probe-vfs-git.mjs "$RUNNER_TEMP/vfs-git"
  isolated-consumers:
    # Each kind packs the packages and installs into temporary apps with the same physical dependency and declaration guards.
    # The slower registry/projection/definitions/testing consumers stay manual, as before.
    name: Isolated package consumers (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: documents
            consumers: document editor html
          - kind: native
            consumers: virtual remote-shell remote-files question presentation
          - kind: canvas
            consumers: canvas canvas-editor canvas-remote
          - kind: composition
            consumers: experience task-list-registry morning pi-chat shared-chat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit actual npm tarballs
        if: matrix.kind == 'documents'
        run: npm run check:pack
      - name: Consumers
        env:
          CONSUMERS: ${{ matrix.consumers }}
        run: |
          for name in $CONSUMERS; do
            echo "::group::test:$name-consumer"
            npm run "test:$name-consumer"
            echo "::endgroup::"
          done
      - name: Install Chromium for the installed PDF viewer check
        if: matrix.kind == 'documents'
        timeout-minutes: 8
        # Ubuntu runners already have Chrome libraries; apt is only a fallback for missing ldd dependencies.
        run: bash scripts/install-ci-chromium.sh 1.63.0
      - name: Allow the Chromium sandbox
        if: matrix.kind == 'documents'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install workspace and portable tree registry recipes
        if: matrix.kind == 'documents'
        run: |
          npm run registry:build
          npm run test:app-registry-consumer
  demo-worker:
    # The public workspace demo's Worker (demos/workspace/cloudflare): build the page and bundle the Worker with a wrangler dry run.
    # No Cloudflare account or secret is used; nothing is deployed.
    name: Public demo Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run workspace-demo:cloudflare:build
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/demo-worker" --config demos/workspace/cloudflare/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
  isolated-consumers-ok:
    name: Isolated package consumers
    if: always()
    needs: [isolated-consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success || exit 1
          done
  ci-ok:
    name: verify
    if: always()
    needs: [verify, tests, release-gate, isolated-consumers, isolated-consumers-ok, demo-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success || exit 1
          done
