name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      version:
        description: "Version already committed in all packages (publish set: boring-agent, boring-ui-kit, boring-files, boring-execution, boring-feedback)"
        required: true
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options: [next, latest, alpha, beta, rc]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.repository == 'hachej/boring-ui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hachej' && github.triggering_actor == 'hachej'
    runs-on: ubuntu-latest
    # Admission waits up to 20 minutes for main's own checks of this commit before falling back to full qualification.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      reuse-ci: ${{ steps.checks.outputs.reuse-ci }}
    steps:
      - name: Bind publication to the reviewed dispatch commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse only green checks of this exact main commit
        id: checks
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-admission.mjs

  verify:
    needs: admit
    if: needs.admit.outputs.reuse-ci != 'true'
    uses: ./.github/workflows/verify.yml
  browser:
    needs: admit
    if: needs.admit.outputs.reuse-ci != 'true'
    uses: ./.github/workflows/studio-scripted.yml
  secrets:
    needs: admit
    uses: ./.github/workflows/secrets.yml

  prepare:
    if: >-
      github.repository == 'hachej/boring-ui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hachej' && github.triggering_actor == 'hachej'
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          package-manager-cache: false
      - name: Pin the npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Build and typecheck the reviewed source
        run: npm run typecheck
      - name: Retain the exact audited tarballs
        run: node scripts/check-npm-packages.mjs --release --out "$RUNNER_TEMP/npm-release"
      - name: Confirm intentionally private packages (boring-browser, boring-testing) are excluded
        run: node scripts/release-set.mjs "$RUNNER_TEMP/npm-release"
      - name: Validate version and dry-run the retained tarballs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm-packages.mjs "$RUNNER_TEMP/npm-release" "$RELEASE_VERSION" "$RELEASE_TAG" --dry-run
      - name: Confirm the reviewed source was not modified
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      always() && !cancelled() &&
      github.repository == 'hachej/boring-ui' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hachej' && github.triggering_actor == 'hachej' &&
      needs.admit.result == 'success' && needs.prepare.result == 'success' &&
      needs.secrets.result == 'success' &&
      ((needs.admit.outputs.reuse-ci == 'true' && needs.verify.result == 'skipped' && needs.browser.result == 'skipped') ||
       (needs.admit.outputs.reuse-ci == 'false' && needs.verify.result == 'success' && needs.browser.result == 'success'))
    needs: [admit, prepare, verify, browser, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install only the pinned publishing CLI, without lifecycle scripts
        run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Verify and publish the approved archives with npm OIDC
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm-packages.mjs "$RUNNER_TEMP/npm-release" "$RELEASE_VERSION" "$RELEASE_TAG" --publish
      - name: Preserve partial and complete publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/publication.json
          if-no-files-found: ignore
          retention-days: 30

  github-release:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Create the GitHub release once
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; nothing to create."
            exit 0
          fi
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" --jq ".[] | select(.merge_commit_sha == \"${RELEASE_COMMIT}\") | .number" | head -n 1) || pr=""
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if [ -n "$pr" ] && gh pr view "$pr" --json body --jq .body > "$notes_file" && [ -s "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          if [ "$RELEASE_TAG" = latest ]; then
            channel=(--latest)
          else
            channel=(--prerelease --latest=false)
          fi
          gh release create "$tag" --target "$RELEASE_COMMIT" --title "$tag" "${channel[@]}" "${notes[@]}"
