name: Studio real-model smoke
# Manual and non-blocking: five scenarios (hello, an artifact, ask_user, a shell task, a subagent) against the real model, retries allowed.
# It prints a pass rate and exits 0 unless the rate is below the threshold. Never a required check, never part of `npm run verify`.
# Needs the repository secret OPENAI_API_KEY (the owner adds it in Settings > Secrets and variables > Actions; nothing here creates it).
on:
  workflow_dispatch:
    inputs:
      min_pass_rate:
        description: Fail the run only if the pass rate is below this fraction (0 to 1)
        default: '0.6'
      retries:
        description: Retries per scenario (a real model sometimes answers in text instead of calling a tool)
        default: '2'
permissions:
  contents: read
jobs:
  smoke:
    name: Studio real-model smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.63.0
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: chromium-headless-shell-1243-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium-headless-shell
      # Ubuntu 24.04 runners block the user namespaces Chromium's sandbox needs; re-allow them for this job.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke scenarios against the real model
        run: npm run studio:smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STUDIO_SMOKE_MIN: ${{ inputs.min_pass_rate }}
          STUDIO_RETRIES: ${{ inputs.retries }}
          STUDIO_EVIDENCE: ${{ runner.temp }}/evidence/studio
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 7
