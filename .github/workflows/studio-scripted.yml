name: Scripted browser journeys
# The blocking browser layer: real Chromium against the studio and the ambient example with a scripted model (no key, no network model,
# one logged retry per journey scenario). A repeated failure blocks. The required check "Studio scripted journeys" is the final ci-ok job.
# The real-model layer is separate and never blocks: .github/workflows/studio-smoke.yml.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
# A new push to a pull request cancels its superseded run; main pushes and release calls keep their own run id and never cancel.
# The literal prefix keeps the release's called workflows in distinct groups.
concurrency:
  group: scripted-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scripted-journeys:
    name: Studio scripted journeys (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [studio-1, studio-2, design, workspace, documents]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Playwright 1.63.0 pins chromium-headless-shell revision 1243 (Chrome 153.0.8010.12); the journeys only need the binary.
      PLAYWRIGHT_VERSION: 1.63.0
      CHROMIUM: ${{ github.workspace }}/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache the pinned Chromium headless shell
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: chromium-headless-shell-1243-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install the pinned Chromium headless shell and its system libraries
        timeout-minutes: 8
        # Ubuntu runners already have Chrome libraries; apt is only a fallback for missing ldd dependencies.
        run: bash scripts/install-ci-chromium.sh "${{ env.PLAYWRIGHT_VERSION }}"
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, so Chromium aborts with
      # "No usable sandbox". Re-allow them for this job rather than running Chromium without its sandbox.
      - name: Allow the Chromium sandbox (user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Stock and brand token conformance, light and dark, desktop and phone
        if: matrix.shard == 'design'
        run: npm run test:design
      - name: Viewer chrome on stock and brand, light and dark, desktop and phone
        if: matrix.shard == 'design'
        run: npm run test:viewer-chrome
        env:
          DESIGN_EVIDENCE: .cache/evidence/shadcn-first/viewer-chrome
      - name: Design evidence
        if: always() && matrix.shard == 'design'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadcn-first-design-evidence-${{ matrix.shard }}
          path: .cache/evidence/shadcn-first
          retention-days: 7
          if-no-files-found: error
      - name: App shell agent layer on a phone and a desktop
        if: matrix.shard == 'design'
        run: node scripts/retry-journey.mjs app-shell:journey
        env:
          APP_EVIDENCE: ${{ runner.temp }}/evidence/app-shell
      - name: App shell layouts workspace and chat on a phone and a desktop
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs app-shell:journey:workspace
        env:
          APP_EVIDENCE: ${{ runner.temp }}/evidence/app-shell
      - name: App shell voice messages, failure, retry and cancellation on a phone and a desktop
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs app-shell:journey:voice
        env:
          VOICE_EVIDENCE: ${{ runner.temp }}/evidence/app-shell-voice
      - name: Workspace app autosave and scrolling during slow history loads
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs workspace-app:journey
        env:
          APP_EVIDENCE: ${{ runner.temp }}/evidence/workspace-app
      - name: Shared conversation in the existing embedded workspace
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs shared-chat:journey
        env:
          SHARED_CHAT_EVIDENCE: ${{ runner.temp }}/evidence/shared-chat
      - name: Shared conversation on the room source, two people, a question and a resume
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs shared-chat:journey:room
        env:
          SHARED_CHAT_EVIDENCE: ${{ runner.temp }}/evidence/shared-chat-room
      - name: Sandboxed HTML mock-ups, theme and element comments
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs mockup:journey
        env:
          APP_EVIDENCE: ${{ runner.temp }}/evidence/mockup-html
      - name: Document draft recovery with IndexedDB
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs draft-recovery:journey
      - name: File tree, mentions, uploads and revision history
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs file-tree:journey
      - name: Mounted canvas command geometry
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs canvas:journey:commands
      - name: Canvas proposal review and persistence
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs canvas:journey:proposals
      - name: Authenticated remote canvas commands
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs canvas:journey:remote
      - name: Board artifact projection, conditional saves and phone read-only input
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs board:journey
      - name: Board viewer evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-viewer-evidence-${{ matrix.shard }}
          path: .cache/evidence/feat-board-viewer
          if-no-files-found: ignore
          retention-days: 7
      - name: Consumer task-list viewer
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs task-list:journey
      - name: Fictional morning experience
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs morning:journey
      - name: Fake-model correctness journey
        if: matrix.shard == 'documents'
        run: node scripts/retry-journey.mjs studio:journey:correctness
      - name: Studio journeys with the scripted model
        if: startsWith(matrix.shard, 'studio-')
        shell: bash
        run: |
          STUDIO_ONLY=$(node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { loadScenarios } from './lab/studio/scenarios/index.mjs';
          import { JOURNEYS } from './lab/studio/journeys/index.mjs';
          assert.ok(['0', '1'].includes(process.env.STUDIO_PART), 'STUDIO_PART must be 0 or 1');
          const ids = [...Object.keys(JOURNEYS), ...(await loadScenarios()).map(scenario => scenario.id)];
          assert.equal(new Set(ids).size, ids.length);
          const selected = ids.filter((_, index) => index % 2 === Number(process.env.STUDIO_PART));
          assert.ok(selected.length > 0);
          console.log(selected.join(','));
          NODE
          )
          export STUDIO_ONLY
          npm run studio:journey:scripted
        env:
          STUDIO_PART: ${{ matrix.shard == 'studio-1' && '0' || '1' }}
          STUDIO_EVIDENCE: ${{ runner.temp }}/evidence/studio
      - name: Workspace demo journey (accounts payable)
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs workspace-demo:journey
        env:
          APP_EVIDENCE: ${{ runner.temp }}/evidence/workspace-demo
      - name: Ambient journey with the scripted model
        if: matrix.shard == 'workspace'
        run: node scripts/retry-journey.mjs ambient:journey:scripted
        env:
          AMBIENT_EVIDENCE: ${{ runner.temp }}/evidence/ambient
      - name: Canvas command evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-command-evidence-${{ matrix.shard }}
          path: .cache/evidence/canvas-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Canvas proposal evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-proposal-evidence-${{ matrix.shard }}
          path: .cache/evidence/canvas-proposals-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Remote canvas evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-remote-evidence-${{ matrix.shard }}
          path: .cache/evidence/canvas-remote-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Task-list evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-list-evidence-${{ matrix.shard }}
          path: .cache/evidence/task-list-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Morning experience evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: morning-evidence-${{ matrix.shard }}
          path: .cache/evidence/morning-browser
          retention-days: 7
      - name: Evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/evidence
            .cache/evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Draft recovery evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: draft-recovery-evidence-${{ matrix.shard }}
          path: .cache/evidence/draft-recovery-browser
          retention-days: 7
          if-no-files-found: ignore
      - name: File tree evidence
        if: always() && matrix.shard == 'documents'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: file-tree-evidence-${{ matrix.shard }}
          path: |
            .cache/evidence/file-tree-browser
            .cache/evidence/library
          retention-days: 7
          if-no-files-found: ignore
  ci-ok:
    name: Studio scripted journeys
    if: always()
    needs: [scripted-journeys]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success || exit 1
          done
