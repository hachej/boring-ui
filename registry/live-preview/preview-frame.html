<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The preview frame. Load it only in <iframe sandbox="allow-scripts"> (no allow-same-origin). The policy closes everything but this page's own script:
     script-src 'self' is the bundle next to this file, 'unsafe-eval' is needed because the compiled preview is evaluated with new Function (sucrase output);
     there is no network (connect-src 'none'), no frames, no forms, images only as data:. Styles are inline (the app's CSS arrives by message). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Preview</title>
<style>html,body{margin:0;padding:0}#root{display:flow-root}body{font-family:system-ui,sans-serif;background:transparent;color:var(--foreground,inherit)}</style>
</head>
<body>
<div id="root"></div>
<script src="preview-frame.js"></script>
</body>
</html>
