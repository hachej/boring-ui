# Boring Factory fleet — workspace-editable, git-audited.
# This file is permanently trust-class B: no agent may modify it via a
# class-A merge (see policy.yaml trust_ladder.class_b_always). Read by
# loadConfiguredAgentFleet() (packages/agent) to compose the production and
# CLI-hub agent fleet when BORING_AGENT_FLEET=1, and by the playground
# (apps/workspace-playground) via the same loader.
#
# Skill digests are authority pins, refreshed via `pnpm check:skill-digests`
# / `scripts/refresh-skill-digests.mjs --write` (gh-1106 slice 1, #1109).
# A stale pin silently DROPS that seat and keeps the fleet — repin in the same
# commit as any .agents/skills/<name>/SKILL.md edit.
#
# Model per seat resolves at boot from policy.yaml's `models.seats` tier
# through the priority-ordered concrete candidates below. Keep seat policy in
# policy.yaml; update provider/model availability here. Per-session and
# per-automation model choice happens at dispatch (#1143), never here.
#
# Roster: TWO seats. The former triage seat is now a worker automation slot. A seat is
# justified by capability posture, never by model choice. Deferred,
# grow-on-demand seats (`concierge`, `reviewer`, `auditor`, `beadle`, any
# `worker-*` variant) hold no seat and no live persona package; their persona
# material is preserved as test fixtures under packages/agent
# .../agentDefinition/__tests__/fixtures/deferred-personas/. Adding one back =
# restore the package under .agents/personas/ plus an entry in this list.


# Owner ruling 2026-08-12: gpt-5.6-sol (pi openai-codex provider) is the
# DEFAULT model for T1/T2 wherever codex is available. Availability is gated
# by the CODEX_SOL_ENABLED marker env var (codex auths via its own login, not
# an API-key env) — set it on hosts with a logged-in codex; unset, tiers fall
# through to anthropic/google exactly as before.
models:
  tiers:
    T1:
      - provider: openai-codex
        id: gpt-5.6-sol
        envVar: CODEX_SOL_ENABLED
      - provider: anthropic
        id: claude-fable-5
        envVar: ANTHROPIC_API_KEY
      - provider: google
        id: gemini-3.1-pro-preview
        envVar: GEMINI_API_KEY
    T2:
      - provider: openai-codex
        id: gpt-5.6-sol
        envVar: CODEX_SOL_ENABLED
      - provider: anthropic
        id: claude-opus-4-8
        envVar: ANTHROPIC_API_KEY
      - provider: google
        id: gemini-3.1-pro-preview
        envVar: GEMINI_API_KEY
    T3:
      - provider: anthropic
        id: claude-sonnet-4-6
        envVar: ANTHROPIC_API_KEY
      - provider: google
        id: gemini-3-pro-preview
        envVar: GEMINI_API_KEY
    T4:
      - provider: anthropic
        id: claude-haiku-4-5-20251001
        envVar: ANTHROPIC_API_KEY
      - provider: google
        id: gemini-3.5-flash
        envVar: GEMINI_API_KEY

seats:
  # The owner's standing counterpart: pinned, conversational, full authority.
  # Dispatches work and normally reads bead end-states. A host-granted, run-scoped
  # raw JSONL diagnostic is the only transcript exception; records stay untrusted.
  - seat: orchestrator
    agentTypeId: boring-orchestrator
    skills:
      - name: plan
        digest: sha256:c348aabea4210bba37068e20cffc0a0cb600dcde8e21f3826ee3ee36cf1c0108
      - name: feedback
        digest: sha256:707ae8fd12ace225be7d6de8c345c7d73cf9aa07763f138419f6d6b26b92a9af
      - name: owner-gate
        digest: sha256:a001dc51b8890f979358bffcf9ebe2d478002b2136a9630b638f77567b82678f
      - name: handoff
        digest: sha256:d3bd45bb74632e8388bc4a9e37febbf9d7332107fe1eff4047e91df23e7a7e17

  # The single implementation seat. Claims a bead, works it in a lane worktree,
  # spawns its own fresh-context review subagents at gate time (`fresh-eyes`),
  # hands off.
  - seat: worker
    agentTypeId: boring-worker
    skills:
      - name: exec
        digest: sha256:d4c358d6c93de99e8158c15e3960ac8eb0fa3486bf8d9688bf8ec59ce2158025
      - name: fresh-eyes
        digest: sha256:58f6cfb66cc2a31238e5c033f42b69b7fbd6089d06c9f6d5108caa7035e5f565
      - name: owner-gate
        digest: sha256:a001dc51b8890f979358bffcf9ebe2d478002b2136a9630b638f77567b82678f
      - name: handoff
        digest: sha256:d3bd45bb74632e8388bc4a9e37febbf9d7332107fe1eff4047e91df23e7a7e17
